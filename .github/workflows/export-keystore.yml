name: Export Keystore (temp)
on:
  workflow_dispatch:
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Decode and upload keystore artifact
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > release.keystore
          echo "$KEYSTORE_PASSWORD" > keystore-meta.txt
          echo "$KEY_ALIAS" >> keystore-meta.txt
          echo "$KEY_PASSWORD" >> keystore-meta.txt
          ls -la release.keystore
          sha1sum release.keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-keystore
          path: |
            release.keystore
            keystore-meta.txt
          retention-days: 1
